[base]
env_name = templerun2

[env]
# One env instance per training slot. Keep episode_length finite so PPO sees
# terminal resets even for a policy that never dies.
episode_length = 200000
enable_submodes = 1
num_agents = 1
# Swipe events at 30 Hz; physics/collisions and rendering remain at 60 Hz.
decision_frames = 2

# Geometry. 1 world unit = 1 metre.
lane_width = 0.85
track_half_width = 1.12
player_radius = 0.44
player_height = 1.04
slide_height = 0.64

# Forward motion. Speed ramps with distance from base_speed toward max_speed.
min_speed = 10.0
max_speed = 21.0
force_scale = 0.1
# TRTrackPacing.RunnerSpeed force buckets, returned as value*0.1:
# <50% 3.0 m/s^2, 50-65% 1.0, 65-85% 0.15, 85-100% 0.05, >=100% 0.
boost_speed = 1.55
boost_distance = 250.0

# Jump / slide, seconds and metres.
jump_velocity = 10.0
gravity = 25.0
slide_duration_factor = 0.07
slide_duration_cap = 0.75
stumble_speed = 0.85
slam_velocity = 20.0
lane_lerp = 0.1

# Turns: a left/right swipe inside this window turns the runner. Missing it
# kills. Window is measured in metres before the segment boundary.
turn_window = 7.0
turn_grace = 0.6

# Spawning. TRTrackPacing milestones drive obstacle/turn/coin spacing.
clear_before_turn = 0.0
clear_after_turn = 10.0
first_obstacle_s = 25.0

# Item rates, per metre.
coin_line_pct = 55
powerup_spacing_min = 400.0
powerup_spacing_max = 800.0

# Powerup durations, seconds.
magnet_time = 10.0
shield_time = 10.0
invuln_time = 4.0
# BonusItemProtoData.VacuumRangeRadius2 = 1200 -> radius sqrt(1200)
magnet_radius = 34.64
coin_red_m = 2500.0
coin_blue_m = 5000.0

# Score / reward. TR2 score is distance plus picked-up coins.
score_distance = 1.0
score_coin = 1.0
multiplier_m = 0.0
multiplier_max = 1

# Keep all rewards inside the Metal/CUDA trainer's [-1, 1] clipping range.
# These values preserve the intended 8:1 death-to-clear ratio.
reward_clear = 0.125
reward_coin = 0.01875
# Gesture frequency is not penalized; deaths remain penalized below.
swipe_cost = 0.0
death_penalty = 1.0

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 200_000_000
gamma = 0.997
gae_lambda = 0.97
# Metal trainer uses Muon, not Adam.
learning_rate = 0.005
minibatch_size = 32768
horizon = 128
ent_coef = 0.001
min_ent_coef = 0.0
anneal_ent_coef = 1
replay_ratio = 4.0
